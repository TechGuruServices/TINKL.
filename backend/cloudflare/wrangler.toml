# TINKL. API worker — backup sync (Durable Object) + Web Push fan-out.
# Static PWA shell is deployed separately to Cloudflare Pages (tinkl-pwa/).
# This worker is API-only: https://tinkl-sync.<your-subdomain>.workers.dev

name = "tinkl-sync"
main = "worker/worker.js"
compatibility_date = "2024-11-01"

# Durable Object binding — TINKL_BACKUP is the name used in worker.js (env.TINKL_BACKUP)
[[durable_objects.bindings]]
name = "TINKL_BACKUP"
class_name = "TinklBackup"

# SQLite-backed migration — required for Durable Objects on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TinklBackup"]

# ---------------------------------------------------------------------------
# Secrets — NEVER put these in wrangler.toml. Set each one with:
#   npx wrangler secret put API_SECRET
#   npx wrangler secret put VAPID_JWK          # full JWK JSON from gen-vapid.mjs
#   npx wrangler secret put VAPID_PUBLIC_KEY   # base64url line from gen-vapid.mjs
#   npx wrangler secret put VAPID_SUBJECT      # e.g. mailto:you@yourdomain
#
# API_SECRET must exactly match the PWA's sync config secret.
# ---------------------------------------------------------------------------
