# ---- TINKL. PWA static serving ----
# Copy the built PWA (dist/ or tinkl-pwa/) into src/main/resources/static/
# preserving relative paths: /index.html /sw.js /manifest.json /offline.html
# /css/** /js/** /assets/**

# Gzip at the servlet layer (Brotli is served pre-compressed — see build.sh,
# served best via reverse proxy / CDN in front of Boot; see note below).
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/manifest+json,image/svg+xml

# Never let the container's default servlet serve these paths — the
# PwaStaticResourceConfig @Configuration owns all cache headers.
spring.web.resources.add-mappings=false
spring.web.resources.static-locations=classpath:/static/

# ---- Notes ----
# 1) Brotli: Spring Boot has no built-in Brotli encoder. Generate .br files at
#    build time (build/build.sh does this) and serve them from nginx / Apache /
#    Cloudflare in front of Boot with `brotli_static on;`. Browsers that send
#    `Accept-Encoding: br` get the .br variant; everyone else gets gzip.
# 2) HTTPS is REQUIRED for service workers (localhost exempt for development).
#    Terminate TLS at the reverse proxy or with server.ssl.* here.
# 3) If you deploy under a context path (server.servlet.context-path=/tinkl),
#    update manifest.json (start_url, scope, id) AND the SW registration +
#    APP_SHELL paths together — they must agree on one scope.
