<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d16" />
  <title>TINKL. — You're Offline</title>
  <style>
    :root { --bg:#05060b; --card:#0b0d16; --ink:#f4f5fb; --ink2:#b9bcd0; --acc:#8b5cf6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #141126 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 400px; text-align: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 24px; padding: 40px 28px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .paw {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 22px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      box-shadow: 0 12px 32px rgba(124,58,237,.45);
    }
    .paw svg { width: 40px; height: 40px; fill: #fff; }
    h1 { font-size: 22px; letter-spacing: .02em; margin-bottom: 8px; }
    p { color: var(--ink2); font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
    p.small { font-size: 13px; opacity: .75; margin-bottom: 24px; }
    .btn {
      display: inline-block; border: 0; cursor: pointer;
      font-size: 16px; font-weight: 700; color: #fff;
      padding: 14px 34px; border-radius: 16px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 10px 28px rgba(139,92,246,.4);
    }
    .btn:active { transform: scale(.97); }
    .status { margin-top: 18px; font-size: 13px; color: var(--ink2); min-height: 20px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.off { background: #f87171; } .dot.on { background: #34d399; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="t">
    <div class="paw" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 13.2c-2.6 0-5.3 2.1-5.3 4.4 0 1.4 1 2.4 2.5 2.4 1 0 1.8-.5 2.8-.5s1.8.5 2.8.5c1.5 0 2.5-1 2.5-2.4 0-2.3-2.7-4.4-5.3-4.4zM6.2 8.2c-1-.3-2.1.8-2.4 2.3-.3 1.6.3 3 1.3 3.3 1 .3 2.1-.8 2.4-2.3.3-1.6-.3-3-1.3-3.3zm11.6 0c-1 .3-1.6 1.7-1.3 3.3.3 1.5 1.4 2.6 2.4 2.3 1-.3 1.6-1.7 1.3-3.3-.3-1.5-1.4-2.6-2.4-2.3zM9.4 3.2c-1.1.2-1.7 1.7-1.4 3.3.3 1.6 1.4 2.8 2.5 2.6 1.1-.2 1.7-1.7 1.4-3.3-.3-1.6-1.4-2.8-2.5-2.6zm5.2 0c-1.1-.2-2.2 1-2.5 2.6-.3 1.6.3 3.1 1.4 3.3 1.1.2 2.2-1 2.5-2.6.3-1.6-.3-3.1-1.4-3.3z"/></svg>
    </div>
    <h1 id="t">You're offline</h1>
    <p>TINKL. can't reach the network right now.</p>
    <p class="small">Your data is safe — everything is stored on this device and syncs automatically when you're back online.</p>
    <button class="btn" id="retry" type="button">Try Again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var status = document.getElementById('status');
      var retry = document.getElementById('retry');
      function render() {
        var online = navigator.onLine;
        status.innerHTML = '<span class="dot ' + (online ? 'on' : 'off') + '"></span>' +
          (online ? 'Connection detected — reloading…' : 'Still offline — waiting for a connection…');
        if (online) setTimeout(function () { location.reload(); }, 600);
      }
      retry.addEventListener('click', function () { location.reload(); });
      window.addEventListener('online', render);
      window.addEventListener('offline', render);
      render();
    })();
  </script>
</body>
</html>
